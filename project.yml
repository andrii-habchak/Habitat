name: Habitat

options:
  bundleIdPrefix: io.github.andrii-habchak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Personal team: set DEVELOPMENT_TEAM locally in Xcode for device builds (DECISIONS D3).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  HabitatKit:
    path: HabitatKit

targets:
  Habitat:
    type: application
    platform: iOS
    sources:
      - path: App/Habitat
        type: syncedFolder
    dependencies:
      - package: HabitatKit
        product: HabitatCore
      - package: HabitatKit
        product: HabitatData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andrii-habchak.Habitat
        PRODUCT_NAME: Habitat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Habitat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ENABLE_PREVIEWS: YES

  HabitatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/HabitatUITests
        type: syncedFolder
    dependencies:
      - target: Habitat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andrii-habchak.HabitatUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Habitat

schemes:
  Habitat:
    build:
      targets:
        Habitat: all
        HabitatUITests: [test]
    test:
      config: Debug
      targets:
        - HabitatUITests
    run:
      config: Debug
