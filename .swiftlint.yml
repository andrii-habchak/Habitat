included:
  - App
  - HabitatKit/Sources
  - HabitatKit/Tests
  - HabitatKit/Package.swift

excluded:
  - build.noindex
  - HabitatKit/.build
  - .run

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded:
    - id

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800
